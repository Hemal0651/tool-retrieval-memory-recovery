[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-retrieval-memory-recovery"
version = "1.0.0"
authors = [
  { name="Hemal Farouqe" },
  { name="Sheikh Mainul Islam" },
  { name="Tanjida Sultana Maria" },
]
description = "Tool Retrieval under Distractor APIs with Memory-Based Recovery"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm-agents", "tool-retrieval", "distractor-apis", "experience-memory", "contrastive-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "scipy>=1.10.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
llm = ["groq>=0.9.0"]
dev = ["pytest", "black", "flake8"]

[tool.setuptools.packages.find]
where = ["src"]
